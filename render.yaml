services:
  - type: web
    name: nextmove
    runtime: docker
    healthCheckPath: /api/health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        value: JBFqnCBsd6RMkjVDRZzb
      - key: ELEVENLABS_MODEL_ID
        value: eleven_flash_v2_5
      - key: OPENAI_MODEL
        value: gpt-5.4-mini
      - key: APP_BASE_URL
        sync: false
      - key: NEXTMOVE_DB_FILE
        value: /var/data/nextmove-db.json
    disk:
      name: nextmove-data
      mountPath: /var/data
      sizeGB: 1
